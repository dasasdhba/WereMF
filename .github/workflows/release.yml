name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            ext: .exe
            zip_name: WereMF-win-x64
          - target: linux-x64
            ext: ""
            zip_name: WereMF-linux-x64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WereMF.sln

      - name: Build WereMFServer
        run: dotnet publish WereMFServer/WereMFServer.csproj -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Build WereMF
        run: dotnet publish WereMF/WereMF.fsproj -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ./publish/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: WereMF-win-x64
          path: ./artifacts/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: WereMF-linux-x64
          path: ./artifacts/linux

      - name: Create release archives
        run: |
          cd ./artifacts/win && zip -r ../../WereMF-win-x64.zip . && cd ../..
          cd ./artifacts/linux && tar -czf ../../WereMF-linux-x64.tar.gz . && cd ../..

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WereMF-win-x64.zip
            WereMF-linux-x64.tar.gz
          prerelease: false
