name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            ext: .exe
            zip_name: WereMF-win-x64
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
            zip_name: WereMF-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WereMF.sln

      - name: Build WereMFServer
        run: dotnet publish WereMFServer/WereMFServer.csproj -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Build WereMF
        run: dotnet publish WereMF/WereMF.fsproj -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Create zip
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.zip_name }}.zip -Force

      - name: Create zip
        if: matrix.os == 'ubuntu-latest'
        run: zip -r ${{ matrix.zip_name }}.zip ./publish/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: WereMF-win-x64
          path: ./artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: WereMF-linux-x64
          path: ./artifacts

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
